# Slalom Airlines Journal, content mountpoint.
#
# The documents are authored in Microsoft Word, in a folder shared with Adobe's
# content bus. The single mountpoints key at the bottom of this file is what
# connects the two. There must be exactly one of it: a second one, even with no
# value under it, makes this file a duplicated mapping key and the YAML fails to
# parse, which the platform reports as "No source document found" on every read.
#
# The folder is the journal folder of the Slalom Airlines Demo team site's
# Documents library. A site created from the Teams template lands on /teams,
# not /sites, and the library's URL segment is Shared Documents whatever the
# rail calls it, so the path is copied from the library rather than assumed.
#
# CONTENT STILL IN CODE, FOR NOW. content/ holds the same documents as da.live
# storage HTML, which is what `npm run up` serves while the mountpoint settles.
# Empirically verified mapping for the local CLI:
#
#   URL /                      -> content/index.html   (rendered page)
#   URL /articles/<slug>       -> content/articles/<slug>.html (rendered page)
#   URL /<path>.plain.html     -> the same document, main fragment only
#   URL /query-index.json      -> content/query-index.json (served raw)
#   any other extension        -> raw file from content/, then repo root
#
# That last line is why the film and the two podcast episodes live in media/
# rather than in the content source: the repository serves them at their path.
#
# NOTE ON MARKDOWN: the CLI serves local .md files RAW ONLY and never renders
# them; its local pipeline reads .html documents and converts them back to
# markdown itself before rendering. That is why content/ is storage HTML.
#
# Once the platform is generating /query-index.json from helix-query.yaml,
# delete content/ (query-index.json included) and drop the content checks from
# tools/validate.mjs. Until then the local copies are what serve.
#
# Other content sources, for reference. Replace the value below, keep the key.
#
#   SharePoint site made the ordinary way
#     /: https://TENANT.sharepoint.com/sites/SITE/Shared%20Documents/journal
#
#   OneDrive for Business, a personal drive instead of a site library. Tried on
#   2026-09-14 and refused: the platform resolved the mountpoint and Microsoft
#   answered 404 on the read, for a guest account with Can edit on the folder.
#     /: https://TENANT-my.sharepoint.com/personal/USER/Documents/journal
#
#   Google Drive, which puts authoring in Google Docs
#     /: https://drive.google.com/drive/folders/FOLDER-ID
#
#   da.live, Adobe's own document editor
#     /: https://content.da.live/ORG/SITE/
#
# Whichever is used, the folder has to be shared with helix@adobe.com with edit
# permission, or consented to through the AEM Content Integration application,
# before anything previews. The URL is the folder's own address, url encoded,
# with no trailing slash. A site set up through the tools.aem.live wizard also
# stores the content source in the configuration service, and that copy is the
# one that governs: changing this file alone is not enough. Full procedure:
# docs/journal-eds-sharepoint-runbook.md in the slalom-airlines monorepo.
mountpoints:
  /: https://twodegrees1.sharepoint.com/teams/SlalomAirlinesDemo/Shared%20Documents/journal
