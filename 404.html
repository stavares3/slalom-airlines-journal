<!DOCTYPE html>
<html lang="en">

<head>
  <title>Page not found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A1428'/%3E%3Cpath d='M4 22 L13 10 L18 17 L23 12 L28 22 Z' fill='%234FC9E8'/%3E%3C/svg%3E">
  <script nonce="aem">window.SAMPLE_PAGEVIEWS_AT_RATE = 'off';</script>
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'secondary', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style nonce="aem">
    main.error {
      min-height: calc(100vh - var(--header-h));
      display: flex;
      align-items: center;
      text-align: center;
    }

    main.error .error-code {
      font-family: var(--font-display);
      font-size: var(--display-xl);
      color: var(--color-midnight);
      margin: 0;
    }
  </style>
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <p class="error-code">404</p>
      <h1 class="error-message">This page is off the route map</h1>
      <p>The address you followed does not match anything in the Journal. Our index changes as new stories board.</p>
      <p class="button-container">
        <a href="/" class="button primary error-button-home">Back to the Journal</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
